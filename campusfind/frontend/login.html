
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusFind</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">Campus<span>Find</span></a>
    <a href="index.html" class="login-btn">Back to Home</a>
</header>

<main class="auth-section">
    <div class="auth-card">
        <p class="tagline">WELCOME BACK</p>
        <h1>Login to CampusFind</h1>
        <p class="auth-description">
            Sign in to report and manage lost items.
        </p>

        <form id="login-form">
            <label for="email">Email Address</label>
            <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
            >

            <label for="password">Password</label>

            <div class="password-box">
                <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                >

                <button
                        type="button"
                        class="eye-button"
                        data-target="password"
                        aria-label="Show password"
                        aria-pressed="false"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="primary-btn auth-submit">
                Login
            </button>

            <p id="message" role="status"></p>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </p>
    </div>
</main>

</body>
</html>
